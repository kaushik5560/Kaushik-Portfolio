                  </span>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mt-3">
                    Skills & Technologies
                  </h2>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {/* Languages */}
                  <div className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                      <span className="text-amber-500">📜</span> Programming Languages

                      {skillsData.languages.map((s, i) => (
                        <div key={i} className="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-700/40 text-sm">
                          <span className="font-medium text-slate-800 dark:text-slate-200">{s.name}</span>
                          <span className="text-xs px-2 py-0.5 rounded-full font-semibold bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-300">{s.level}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Frontend */}
                  <div className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                      <span className="text-blue-500">🎨</span> Frontend Technologies
                    </h3>
                    <div className="space-y-2.5">
                      {skillsData.frontend.map((s, i) => (
                        <div key={i} className="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-700/40 text-sm">
                          <span className="font-medium text-slate-800 dark:text-slate-200">{s.name}</span>
                          <span className="text-xs px-2 py-0.5 rounded-full font-semibold bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300">{s.level}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Backend */}
                  <div className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                      <span className="text-emerald-500">⚙️</span> Backend & Databases
                    </h3>
                    <div className="space-y-2.5">
                      {skillsData.backend.map((s, i) => (
                        <div key={i} className="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-700/40 text-sm">
                          <span className="font-medium text-slate-800 dark:text-slate-200">{s.name}</span>
                          <span className="text-xs px-2 py-0.5 rounded-full font-semibold bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300">{s.level}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Tools */}
                  <div className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                      <span className="text-purple-500">🛠️</span> Developer Tools
                    </h3>
                    <div className="space-y-2.5">
                      {skillsData.tools.map((s, i) => (
                        <div key={i} className="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-700/40 text-sm">
                          <span className="font-medium text-slate-800 dark:text-slate-200">{s.name}</span>
                          <span className="text-xs px-2 py-0.5 rounded-full font-semibold bg-purple-100 dark:bg-purple-900/60 text-purple-700 dark:text-purple-300">{s.level}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* CS Fundamentals */}
                  <div className="md:col-span-2 p-6 rounded-2xl bg-gradient-to-br from-slate-900 to-blue-950 text-white shadow-md">
                    <h3 className="text-lg font-bold mb-2 flex items-center gap-2">
                      <span>📚</span> Core Computer Science Coursework
                    </h3>
                    <p className="text-slate-300 text-xs sm:text-sm mb-4">
                      Academic foundation from university curriculum supporting scalable design:
                    </p>
                    <div className="flex flex-wrap gap-2">
                      {skillsData.coursework.map((course, idx) => (
                        <span key={idx} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white/10 border border-white/10 text-blue-100">
                          ✓ {course}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* EXPERIENCE SECTION */}
            <section id="experience" className="py-20 bg-slate-100/60 dark:bg-slate-900/40">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-2xl mx-auto mb-14">
                  <span className="px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300">
                    Internship
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mt-3">
                    Practical Research Experience
                  </h2>
                </div>

                <div className="max-w-4xl mx-auto space-y-6">
                  {experienceData.map((exp, idx) => (
                    <div key={idx} className="p-6 sm:p-8 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-100 dark:border-slate-700">
                        <div>
                          <span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400">
                            {exp.type}
                          </span>
                          <h3 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">{exp.role}</h3>
                          <p className="text-base font-semibold text-blue-600 dark:text-blue-400">{exp.organization}</p>
                        </div>
                        <div className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 sm:text-right">
                          <p>📅 {exp.period}</p>
                          <p>📍 {exp.location}</p>
                        </div>
                      </div>

                      <div className="mt-4 space-y-2">
                        <p className="text-sm font-medium text-slate-700 dark:text-slate-300">
                          <strong className="text-blue-600">Focus:</strong> {exp.description}
                        </p>
                        <ul className="space-y-2 pt-2">
                          {exp.achievements.map((item, i) => (
                            <li key={i} className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 flex items-start gap-2">
                              <span className="text-emerald-500 font-bold">✓</span>
                              <span>{item}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      <div className="mt-5 pt-4 border-t border-slate-100 dark:border-slate-700 flex flex-wrap gap-2">
                        {exp.techStack.map((tech, i) => (
                          <span key={i} className="px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300">
                            {tech}
                          </span>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* PROJECTS SECTION */}
            <section id="projects" className="py-20">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-2xl mx-auto mb-10">
                  <span className="px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300">
                    Portfolio Projects
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mt-3">
                    Featured Applications
                  </h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  {projectsData.map((project) => (
                    <div key={project.id} className="flex flex-col justify-between p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-lg transition-all">
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-2">
                          <span className="px-2.5 py-1 rounded-md text-xs font-semibold bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400">
                            {project.category}
                          </span>
                          <span className="text-xs text-slate-400">📅 {project.date}</span>
                        </div>
                        <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-2">{project.title}</h3>
                        <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">{project.description}</p>
                        
                        <ul className="mt-4 space-y-1.5 border-t border-slate-100 dark:border-slate-700 pt-3">
                          {project.points.map((pt, i) => (
                            <li key={i} className="text-xs text-slate-500 dark:text-slate-400 flex items-start gap-1.5">
                              <span className="text-blue-500">•</span>
                              <span>{pt}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      <div className="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700">
                        <div className="flex flex-wrap gap-1.5 mb-4">
                          {project.tech.map((t, i) => (
                            <span key={i} className="px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300">
                              {t}
                            </span>
                          ))}
                        </div>
                        <div className="flex items-center gap-3">
                          <a href={project.github} target="_blank" className="flex-1 py-2 text-center rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-800 dark:text-slate-200">
                            Source Code
                          </a>
                          <a href={project.live} className="flex-1 py-2 text-center rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white">
                            Live Demo
                          </a>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* EDUCATION SECTION */}
            <section id="education" className="py-20 bg-slate-100/60 dark:bg-slate-900/40">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-2xl mx-auto mb-14">
                  <span className="px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300">
                    Academic Background
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mt-3">
                    Education Journey
                  </h2>
                </div>

                <div className="max-w-3xl mx-auto border-l-2 border-blue-500/30 pl-6 space-y-8">
                  {educationData.map((edu, idx) => (
                    <div key={idx} className="relative p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                      <div className="absolute -left-[31px] top-6 w-3.5 h-3.5 rounded-full bg-blue-600 ring-4 ring-white dark:ring-slate-900" />
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-2">
                        <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 w-fit">
                          {edu.score}
                        </span>
                        <span className="text-xs text-slate-500">{edu.period} • {edu.location}</span>
                      </div>
                      <h3 className="text-lg font-bold text-slate-900 dark:text-white">{edu.degree}</h3>
                      <p className="text-sm font-semibold text-blue-600 dark:text-blue-400">{edu.institution}</p>
                      <p className="text-xs text-slate-500 mt-1">{edu.highlights}</p>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* ACHIEVEMENTS & CERTIFICATIONS */}
            <section id="achievements" className="py-20">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-2xl mx-auto mb-14">
                  <span className="px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300">
                    Credentials
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mt-3">
                    Certifications & Leadership
                  </h2>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  {/* Certifications */}
                  <div className="space-y-4">
                    <h3 className="text-xl font-bold text-slate-900 dark:text-white pb-2 border-b border-slate-200 dark:border-slate-800 flex items-center gap-2">
                      <span>🎖️</span> Certifications
                    </h3>
                    {certificationsData.map((c, i) => (
                      <div key={i} className="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div className="flex items-start justify-between gap-2 mb-1">
                          <div>
                            <h4 className="font-bold text-slate-900 dark:text-white text-base">{c.title}</h4>
                            <p className="text-xs font-semibold text-blue-600">{c.issuer}</p>
                          </div>
                          <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-300">
                            {c.badge}
                          </span>
                        </div>
                        <p className="text-xs text-slate-500 mt-2">{c.description}</p>
                      </div>
                    ))}
                  </div>

                  {/* Extracurricular */}
                  <div className="space-y-4">
                    <h3 className="text-xl font-bold text-slate-900 dark:text-white pb-2 border-b border-slate-200 dark:border-slate-800 flex items-center gap-2">
                      <span>🏆</span> Hackathons & Leadership
                    </h3>
                    {extracurricularData.map((e, i) => (
                      <div key={i} className="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div className="flex items-start justify-between gap-2 mb-1">
                          <div>
                            <h4 className="font-bold text-slate-900 dark:text-white text-base">{e.title}</h4>
                            <p className="text-xs font-semibold text-purple-600">{e.organization}</p>
                          </div>
                          <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-100 dark:bg-purple-900/60 text-purple-700 dark:text-purple-300">
                            {e.role}
                          </span>
                        </div>
                        <p className="text-xs text-slate-500 mt-2">{e.description}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            {/* CONTACT SECTION */}
            <section id="contact" className="py-20 bg-slate-100/60 dark:bg-slate-900/40">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-2xl mx-auto mb-14">
                  <span className="px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300">
                    Contact
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mt-3">
                    Let's Connect & Collaborate
                  </h2>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 max-w-5xl mx-auto">
                  <div className="lg:col-span-5 space-y-4">
                    <div className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                      <p className="text-xs font-semibold text-slate-400 uppercase">Email Me</p>
                      <p className="text-base font-bold text-slate-900 dark:text-white mt-1 break-all">{personalInfo.email}</p>
                      <button onClick={copyEmail} className="mt-3 text-xs text-blue-600 font-semibold underline">
                        {copied ? '✓ Copied to Clipboard!' : 'Copy Email Address'}
                      </button>
                    </div>

                    <div className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                      <p className="text-xs font-semibold text-slate-400 uppercase">Phone & WhatsApp</p>
                      <p className="text-base font-bold text-slate-900 dark:text-white mt-1">{personalInfo.phone}</p>
                      <a href={`tel:${personalInfo.phone.replace(/[^0-9+]/g, '')}`} className="mt-3 inline-block text-xs text-emerald-600 font-semibold underline">
                        Call directly
                      </a>
                    </div>

                    <div className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                      <p className="text-xs font-semibold text-slate-400 uppercase">Location</p>
                      <p className="text-base font-bold text-slate-900 dark:text-white mt-1">{personalInfo.location}</p>
                    </div>
                  </div>

                  <div className="lg:col-span-7">
                    <div className="p-6 sm:p-8 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
                      <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-4">Send a Message</h3>
                      {formSent ? (
                        <div className="p-6 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 text-center text-emerald-800 dark:text-emerald-200">
                          <p className="font-bold">✓ Message Received!</p>
                          <p className="text-xs mt-1">Thank you, Kaushik will connect with you soon.</p>
                        </div>
                      ) : (
                        <form onSubmit={handleContactSubmit} className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold mb-1">Your Name</label>
                            <input
                              type="text"
                              required
                              value={contactForm.name}
                              onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                              placeholder="Your full name"
                              className="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold mb-1">Your Email</label>
                            <input
                              type="email"
                              required
                              value={contactForm.email}
                              onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                              placeholder="name@company.com"
                              className="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold mb-1">Message</label>
                            <textarea
                              required
                              rows={4}
                              value={contactForm.message}
                              onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                              placeholder="Hi Kaushik, I would like to discuss..."
                              className="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                            />
                          </div>
                          <button
                            type="submit"
                            className="w-full py-3 rounded-xl font-semibold text-sm text-white bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-500/25"
                          >
                            Send Message
                          </button>
                        </form>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 py-8 text-center text-xs text-slate-500">
            <p className="font-semibold text-slate-800 dark:text-slate-200 text-sm mb-1">Kaushik Kumar Pandey</p>
            <p>© {new Date().getFullYear()} All Rights Reserved. Built with React & Tailwind CSS.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
